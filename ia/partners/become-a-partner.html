<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Become a partner — Cares of Washington</title>
  <link rel="stylesheet" href="../assets/css/styles.css?v=63" />
</head>
<body>

  <div data-site-header></div>
  <main class="inner-page">

    <div class="inner-page-header">
      <a href="community-partners.html" class="back-link story-page-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Become a partner
      </a>
    </div>

    <section class="inner-section">
      <form class="form-stack" id="partner-form" action="#" method="post">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="business-name">Business name</label>
            <input class="form-input" type="text" id="business-name" name="business_name" autocomplete="organization" />
          </div>
          <div class="form-group">
            <label class="form-label" for="business-address">Business address</label>
            <input class="form-input" type="text" id="business-address" name="business_address" autocomplete="street-address" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first-name">First name</label>
            <input class="form-input" type="text" id="first-name" name="first_name" autocomplete="given-name" />
          </div>
          <div class="form-group">
            <label class="form-label" for="last-name">Last name</label>
            <input class="form-input" type="text" id="last-name" name="last_name" autocomplete="family-name" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" />
          </div>
        </div>

        <div class="form-group">
          <p class="form-label" style="margin-bottom:10px;">Have you hired disabled employees before?</p>
          <div class="form-checkbox-group">
            <label class="form-checkbox-label">
              <input type="radio" name="hired_disabled" value="yes" style="width:18px;height:18px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;" />
              Yes
            </label>
            <label class="form-checkbox-label">
              <input type="radio" name="hired_disabled" value="no" style="width:18px;height:18px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;" />
              No
            </label>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Tell us about your business and what kind of job candidate you need</label>
          <textarea class="form-textarea" id="message" name="message" rows="5"></textarea>
        </div>

        <label class="form-attach">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          Attach documents
          <input type="file" style="display:none" multiple />
        </label>

        <div style="display:flex; justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>

      </form>
    </section>

  </main>

  <!-- Toast -->
  <div class="toast" id="partner-toast" role="status" aria-live="polite">
    <div class="toast-inner">
      <div class="toast-body">
        <span>An automated email has been sent to you to confirm your form was submitted. Someone from Cares will be in touch within 3–5 business days.</span>
        <a href="#partner-form" class="toast-edit" id="toast-edit-link">Edit form</a>
      </div>
      <button class="toast-close" id="toast-close" aria-label="Dismiss">&#x2715;</button>
    </div>
  </div>

  <div data-site-footer></div>

  <script src="../assets/js/nav.js?v=11"></script>
  <script>
    const form = document.getElementById('partner-form');
    const toast = document.getElementById('partner-toast');
    const toastClose = document.getElementById('toast-close');
    const toastEditLink = document.getElementById('toast-edit-link');

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      sessionStorage.setItem('partner_form_submitted', '1');
      history.back();
    });

    toastClose.addEventListener('click', function () {
      toast.classList.remove('toast-show');
    });

    toastEditLink.addEventListener('click', function (e) {
      e.preventDefault();
      toast.classList.remove('toast-show');
      form.scrollIntoView({ behavior: 'smooth', block: 'start' });
      form.querySelector('input, textarea, select').focus();
    });
  </script>
</body>
</html>
