<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Donate — Cares of Washington</title>
  <link rel="stylesheet" href="../assets/css/styles.css?v=63" />
</head>
<body>

  <div data-site-header></div>
  <main class="inner-page">

    <div class="donate-layout">

      <!-- Left column -->
      <div class="donate-photo-card">
        <div class="donate-photo-wrap">
          <img src="../assets/photo-hero-hands.png" alt="A caregiver holding hands with an elderly client in a wheelchair" class="donate-photo" />
          <img src="../assets/cares-logo.png" alt="Cares of Washington" class="donate-photo-logo" />
        </div>

        <div class="donate-photo-card-body">
          <div class="donate-share-icons">
            <a href="https://www.facebook.com/sharer/sharer.php?u=https://caresofwa.org/give/donate.html" target="_blank" rel="noopener noreferrer" class="donate-icon-btn" aria-label="Share on Facebook"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 2h-3a5 5 0 0 0-5 5v3H7v4h3v8h4v-8h3l1-4h-4V7a1 1 0 0 1 1-1h3z"/></svg></a>
            <a href="https://twitter.com/intent/tweet?url=https://caresofwa.org/give/donate.html&text=Support+Cares+of+Washington" target="_blank" rel="noopener noreferrer" class="donate-icon-btn" aria-label="Share on X"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-4.714-6.231-5.401 6.231H2.746l7.73-8.835L2.043 2.25H8.1l4.258 5.63 5.886-5.63zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg></a>
            <a href="mailto:?subject=Support+Cares+of+Washington&body=https://caresofwa.org/give/donate.html" class="donate-icon-btn" aria-label="Share via email"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><polyline points="2,4 12,13 22,4"/></svg></a>
            <a href="https://www.linkedin.com/sharing/share-offsite/?url=https://caresofwa.org/give/donate.html" target="_blank" rel="noopener noreferrer" class="donate-icon-btn" aria-label="Share on LinkedIn"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M16 8a6 6 0 0 1 6 6v7h-4v-7a2 2 0 0 0-2-2 2 2 0 0 0-2 2v7h-4v-7a6 6 0 0 1 6-6z"/><rect x="2" y="9" width="4" height="12"/><circle cx="4" cy="4" r="2"/></svg></a>
            <button type="button" id="copy-link-btn" class="donate-icon-btn" aria-label="Copy link"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg></button>
          </div>

          <button type="button" class="donate-fundraiser-btn">
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6"/><path d="M22 11h-6"/></svg>
            Start a Fundraiser
          </button>

          <p class="donate-mission">Cares of Washington's mission is to support people with disabilities and low incomes realize their purpose, potential and strength.</p>
        </div>
      </div>

      <!-- Donation card -->
      <div class="donate-card">
        <h2 class="donate-card-title">Make a Donation</h2>

        <div class="donate-freq-tabs">
          <button type="button" class="donate-freq-tab active" data-freq="one-time">One Time</button>
          <button type="button" class="donate-freq-tab" data-freq="monthly">Monthly</button>
        </div>

        <div class="donate-amount-options">
          <label class="donate-amount-option selected">
            <input type="radio" name="preset_amount" value="25" checked />
            <span class="donate-amount-value">$25 <span class="donate-amount-freq">One Time</span></span>
            <span class="donate-amount-check"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="donate-amount-option">
            <input type="radio" name="preset_amount" value="50" />
            <span class="donate-amount-value">$50 <span class="donate-amount-freq">One Time</span></span>
            <span class="donate-amount-check"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="donate-amount-option">
            <input type="radio" name="preset_amount" value="100" />
            <span class="donate-amount-value">$100 <span class="donate-amount-freq">One Time</span></span>
            <span class="donate-amount-check"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="donate-amount-option">
            <input type="radio" name="preset_amount" value="250" />
            <span class="donate-amount-value">$250 <span class="donate-amount-freq">One Time</span></span>
            <span class="donate-amount-check"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
          <label class="donate-amount-option donate-amount-custom" id="custom-amount-option">
            <input type="radio" name="preset_amount" value="custom" />
            <span class="donate-amount-value">Custom Amount <span class="donate-amount-freq">One Time</span></span>
            <span class="donate-amount-check"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg></span>
          </label>
        </div>

        <div class="form-currency donate-custom-input" id="custom-amount-group">
          <span class="form-currency-symbol">$</span>
          <input class="form-input" type="number" id="donation-amount" name="amount" min="1" />
          <span class="donate-custom-usd">USD</span>
        </div>

        <div class="donate-toggles">
          <label class="donate-toggle-row">
            <span class="donate-toggle">
              <input type="checkbox" id="toggle-anonymous" />
              <span class="donate-toggle-slider"></span>
            </span>
            <span>Show my name as anonymous when displaying my name in public</span>
          </label>
          <label class="donate-toggle-row">
            <span class="donate-toggle">
              <input type="checkbox" id="toggle-dedicate" />
              <span class="donate-toggle-slider"></span>
            </span>
            <span style="flex:1;">Dedicate this donation</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="var(--text-mid)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
          </label>
        </div>

        <button type="button" class="btn btn-primary donate-submit-btn" id="donate-submit-btn">Donate $25 One Time</button>
      </div>

    </div>

    <p class="donate-legal">Cares of Washington is a registered 501(c)(3) nonprofit (EIN: 13-4237286).<br>Need help? Email <a href="mailto:support@givelively.org">support@givelively.org</a></p>

  </main>

  <div data-site-footer></div>

  <script src="../assets/js/nav.js?v=11"></script>
  <script>
    var state = { freq: 'one-time', amount: 25, custom: null };

    function freqLabel() { return state.freq === 'monthly' ? 'Monthly' : 'One Time'; }

    function updateSubmitButton() {
      var amount = state.amount === 'custom' ? (state.custom || 0) : state.amount;
      document.getElementById('donate-submit-btn').textContent = 'Donate $' + amount + ' ' + freqLabel();
    }

    document.querySelectorAll('.donate-freq-tab').forEach(function (tab) {
      tab.addEventListener('click', function () {
        document.querySelectorAll('.donate-freq-tab').forEach(function (t) { t.classList.remove('active'); });
        tab.classList.add('active');
        state.freq = tab.dataset.freq;
        document.querySelectorAll('.donate-amount-freq').forEach(function (el) { el.textContent = freqLabel(); });
        updateSubmitButton();
      });
    });

    document.querySelectorAll('input[name="preset_amount"]').forEach(function (radio) {
      radio.addEventListener('change', function () {
        document.querySelectorAll('.donate-amount-option').forEach(function (opt) { opt.classList.remove('selected'); });
        this.closest('.donate-amount-option').classList.add('selected');

        var group = document.getElementById('custom-amount-group');
        var isCustom = this.value === 'custom';
        group.classList.toggle('show', isCustom);
        if (isCustom) {
          document.getElementById('donation-amount').focus();
          state.amount = 'custom';
        } else {
          state.amount = this.value;
        }
        updateSubmitButton();
      });
    });

    document.getElementById('donation-amount').addEventListener('input', function () {
      state.custom = this.value;
      updateSubmitButton();
    });

    document.getElementById('copy-link-btn').addEventListener('click', function () {
      navigator.clipboard.writeText(window.location.href).then(function () {
        var btn = document.getElementById('copy-link-btn');
        btn.setAttribute('aria-label', 'Link copied!');
        setTimeout(function () { btn.setAttribute('aria-label', 'Copy link'); }, 2000);
      }).catch(function () {});
    });
  </script>
</body>
</html>
