<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Applying for Services — Cares of Washington</title>
  <link rel="stylesheet" href="../assets/css/styles.css?v=11" />
</head>
<body>

  <div data-site-header></div>
  <main class="inner-page">

    <div class="inner-page-header">
      <a href="javascript:history.back()" class="back-link story-page-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        <span id="form-title">Applying for services</span>
      </a>
    </div>

    <section class="inner-section">
      <form class="form-stack" action="#" method="post">

        <div class="form-group form-full">
          <label class="form-label">I'm filling out this form as</label>
          <div class="form-checkbox-group">
            <label class="form-checkbox-label">
              <input type="radio" name="filling_as" value="case_manager" />
              A case manager
            </label>
            <label class="form-checkbox-label">
              <input type="radio" name="filling_as" value="myself" />
              Myself
            </label>
            <label class="form-checkbox-label">
              <input type="radio" name="filling_as" value="caretaker" />
              A caretaker
            </label>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first-name">First name</label>
            <input class="form-input" type="text" id="first-name" name="first_name" autocomplete="given-name" />
          </div>
          <div class="form-group">
            <label class="form-label" for="last-name">Last name</label>
            <input class="form-input" type="text" id="last-name" name="last_name" autocomplete="family-name" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="dob">Date of birth</label>
            <input class="form-input" type="date" id="dob" name="dob" />
          </div>
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" />
          </div>
          <div class="form-group">
            <label class="form-label" for="referral">Who referred you to Cares of Washington?</label>
            <input class="form-input" type="text" id="referral" name="referral" />
          </div>
        </div>

        <div class="form-group form-full">
          <label class="form-label">Categorized as significantly disabled</label>
          <div class="form-checkbox-group">
            <label class="form-checkbox-label">
              <input type="radio" name="significantly_disabled" value="yes" style="width:18px;height:18px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;" />
              Yes
            </label>
            <label class="form-checkbox-label">
              <input type="radio" name="significantly_disabled" value="no" style="width:18px;height:18px;accent-color:var(--teal);cursor:pointer;flex-shrink:0;" />
              No
            </label>
          </div>
        </div>

        <div class="form-group form-full">
          <label class="form-label" for="disability-impact">How does your disability affect your ability to work?</label>
          <textarea class="form-textarea" id="disability-impact" name="disability_impact" rows="4"></textarea>
        </div>

        <div class="form-group form-full">
          <label class="form-label" for="work-history">Work history</label>
          <textarea class="form-textarea" id="work-history" name="work_history" rows="4"></textarea>
        </div>

        <div class="form-group form-full">
          <label class="form-label" for="education">Education</label>
          <textarea class="form-textarea" id="education" name="education" rows="4"></textarea>
        </div>

        <label class="form-attach form-full">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          Attach documents
          <input type="file" style="display:none" multiple />
        </label>

        <div class="form-group form-full">
          <label class="form-label" for="special-skills">Special skills or equipment you can operate</label>
          <textarea class="form-textarea" id="special-skills" name="special_skills" rows="4"></textarea>
        </div>

        <div class="form-group">
          <label class="form-label" for="min-salary">Minimum salary requirement</label>
          <div class="form-currency">
            <span class="form-currency-symbol">$</span>
            <input class="form-input" type="number" id="min-salary" name="min_salary" min="0" step="1000" placeholder="0" />
          </div>
        </div>

        <div style="display:flex; justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>

      </form>
    </section>

  </main>

  <div data-site-footer></div>

  <script src="../assets/js/nav.js?v=6"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const service = params.get('service');
    if (service) {
      document.getElementById('form-title').textContent = 'Applying for ' + service;
      document.title = 'Applying for ' + service + ' — Cares of Washington';
    }

    document.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();
      sessionStorage.setItem('cares_applied', '1');
      sessionStorage.setItem('cares_apply_url', location.href);
      history.back();
    });
  </script>
</body>
</html>
