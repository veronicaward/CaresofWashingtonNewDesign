<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Send Cares a message — Cares of Washington</title>
  <link rel="stylesheet" href="../assets/css/styles.css?v=53" />
</head>
<body>

  <div data-site-header></div>
  <main class="inner-page">

    <div class="inner-page-header">
      <a href="contact.html" class="back-link story-page-title">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
        Send Cares a message
      </a>
    </div>

    <section class="inner-section">
      <form class="form-stack" action="#" method="post">

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="first-name">First name</label>
            <input class="form-input" type="text" id="first-name" name="first_name" autocomplete="given-name" />
          </div>
          <div class="form-group">
            <label class="form-label" for="last-name">Last name</label>
            <input class="form-input" type="text" id="last-name" name="last_name" autocomplete="family-name" />
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="email">Email</label>
            <input class="form-input" type="email" id="email" name="email" autocomplete="email" />
          </div>
          <div class="form-group">
            <label class="form-label" for="phone">Phone</label>
            <input class="form-input" type="tel" id="phone" name="phone" autocomplete="tel" />
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="subject">Subject</label>
          <input class="form-input" type="text" id="subject" name="subject" />
        </div>

        <div class="form-group">
          <label class="form-label" for="message">Message</label>
          <textarea class="form-textarea" id="message" name="message" rows="5"></textarea>
        </div>

        <label class="form-attach">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>
          Attach documents
          <input type="file" style="display:none" multiple />
        </label>

        <div style="display:flex; justify-content:flex-end;">
          <button type="submit" class="btn btn-primary">Submit</button>
        </div>

      </form>
    </section>

  </main>

  <div data-site-footer></div>

  <script src="../assets/js/nav.js?v=11"></script>
  <script>
    document.querySelector('form').addEventListener('submit', function (e) {
      e.preventDefault();
      sessionStorage.setItem('cares_message_sent', '1');
      history.back();
    });
  </script>
</body>
</html>
